<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">POTS and Dysautonomia Research Findings social preview, search window concept</title>
  <desc id="desc">An airy search interface showing a query and evidence-backed result rows.</desc>
  <rect width="1200" height="630" fill="#e9f0ec"/>
  <circle cx="1100" cy="-20" r="220" fill="#c7d8cf"/>
  <circle cx="60" cy="610" r="170" fill="#d9e4de"/>
  <g transform="translate(70 62)">
    <g aria-label="favicon mark">
      <rect width="50" height="50" rx="25" fill="#163f35"/>
      <path d="M14 17h14a8 8 0 0 1 0 16H14V17Z" fill="none" stroke="#edf3ef" stroke-width="3"/>
      <circle cx="34" cy="34" r="5" fill="#f36a3e"/>
    </g>
    <text x="0" y="120" fill="#12352d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="54" font-weight="720" letter-spacing="-1.8">POTS &amp; Dysautonomia</text>
    <text x="0" y="178" fill="#12352d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="54" font-weight="720" letter-spacing="-1.8">Research Findings</text>
    <text x="2" y="227" fill="#4c675f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">36,459 extracted findings from 3,121 papers so far.</text>
  </g>
  <g transform="translate(535 305) rotate(-2) scale(.91)">
    <rect width="640" height="315" rx="18" fill="#fbfdfb" stroke="#b8cac1" stroke-width="2"/>
    <rect x="28" y="28" width="584" height="56" rx="10" fill="#fff" stroke="#b8cac1"/>
    <circle cx="56" cy="56" r="10" fill="none" stroke="#496c62" stroke-width="2"/>
    <path d="m63 64 8 8" stroke="#496c62" stroke-width="2" stroke-linecap="round"/>
    <text x="85" y="63" fill="#163f35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">norepinephrine elevated in POTS</text>
    <g transform="translate(28 108)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <rect width="584" height="78" rx="9" fill="#edf4f0"/>
      <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#f36a3e"/>
      <text x="20" y="28" fill="#173c33" font-size="16" font-weight="650">Norepinephrine was elevated after standing</text>
      <text x="20" y="53" fill="#5b716a" font-size="13">Cohort · confirmed · 2024 · PMID 39401808</text>
      <rect x="468" y="20" width="92" height="26" rx="13" fill="#d7e7df"/>
      <text x="487" y="38" fill="#285c4e" font-size="12" font-weight="650">POTS</text>
      <rect y="92" width="584" height="78" rx="9" fill="#f8faf8" stroke="#d7e1dc"/>
      <text x="20" y="120" fill="#173c33" font-size="16" font-weight="650">Plasma norepinephrine increased by 71%</text>
      <text x="20" y="145" fill="#5b716a" font-size="13">RCT · confirmed · 2023 · PMID 37303338</text>
    </g>
