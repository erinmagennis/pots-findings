<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">POTS and Dysautonomia Research Findings social preview, signal concept</title>
  <desc id="desc">A dark research signal map based on real associations and contradictions in the database.</desc>
