    <text x="0" y="176" fill="#eef3ef" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="55" font-weight="690" letter-spacing="-1.7">Research Findings</text>
    <text x="2" y="226" fill="#aab8ae" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">36,459 extracted findings from 3,121 papers so far.</text>
